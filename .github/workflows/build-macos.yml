name: Build PikaTube for Intel macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "requirements.txt"
      - ".github/workflows/build-macos.yml"

permissions:
  contents: read

jobs:
  build:
    # Intel runner for the 2020 Intel MacBook Pro.
    runs-on: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build macOS app bundle
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --name PikaTube
          --osx-bundle-identifier jp.pika.pikatube
          --collect-all PySide6
          --collect-all shiboken6
          --collect-all yt_dlp
          app.py

      - name: Package app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent PikaTube.app PikaTube-macOS-x86_64.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: PikaTube-macOS-x86_64
          path: dist/PikaTube-macOS-x86_64.zip
          if-no-files-found: error
          retention-days: 14
